# Build Stormbreaker kernel (miatoll) di GitHub Actions.
# Kernel 4.14 gagal dengan clang >= 12 -> bootstrap.sh meng-clone clang 11 pinned (r6443078).
# Trigger manual (workflow_dispatch) atau tag 'kernel-v*'.
name: build-stormbreaker-kernel

on:
  workflow_dispatch:
  push:
    tags: ['kernel-v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout pureport-17ultra (scripts/)
        uses: actions/checkout@v4

      - name: Bootstrap kernel tree + build
        run: bash scripts/bootstrap.sh "$RUNNER_WORKSPACE"

      - name: Upload flashable AnyKernel zip
        uses: actions/upload-artifact@v4
        with:
          name: stormbreaker-miatoll-${{ github.run_number }}
          path: ${{ runner.workspace }}/kernel_joyeuse/AnyKernel/*.zip
          if-no-files-found: error
